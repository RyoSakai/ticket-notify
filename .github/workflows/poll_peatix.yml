name: Peatix 新着通知

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'   # 5分おき（オフセット2分、混雑回避）
  workflow_dispatch:          # 手動実行ボタン
    inputs:
      rewind_cursor:
        description: 'テスト用：カーソルを巻き戻して通知を強制送信'
        type: boolean
        default: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: state.json を復元
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: peatix-state-${{ github.run_id }}
          restore-keys: peatix-state-

      - name: MABC の cursor を過去に設定（既存購入を全件通知）
        if: ${{ inputs.rewind_cursor == true }}
        run: |
          python3 -c "import json, os; s = json.loads(open('state.json').read()) if os.path.exists('state.json') else {}; s['peatix_4831575'] = {'last_poll_time': '2020-01-01T00:00:00Z'}; open('state.json','w').write(json.dumps(s, indent=2)); print('MABC cursor を 2020-01-01 に設定')"

      - name: .env を構築
        run: |
          cp config.env .env
          echo "PEATIX_EMAIL=${{ secrets.PEATIX_EMAIL }}" >> .env
          echo "PEATIX_PASSWORD=${{ secrets.PEATIX_PASSWORD }}" >> .env
          echo "SLACK_TOKEN=${{ secrets.SLACK_TOKEN }}" >> .env

      - name: Peatix ポーリング実行
        run: python3 poll_peatix.py

      - name: state.json を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: peatix-state-${{ github.run_id }}
