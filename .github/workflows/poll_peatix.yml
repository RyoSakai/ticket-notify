name: Peatix 新着通知

on:
  schedule:
    - cron: '*/5 * * * *'   # 5分おき（UTC）
  workflow_dispatch:          # 手動実行ボタン
    inputs:
      rewind_cursor:
        description: 'テスト用：カーソルを巻き戻して通知を強制送信'
        type: boolean
        default: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: state.json を復元
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: peatix-state-${{ github.run_id }}
          restore-keys: peatix-state-

      - name: テスト用カーソル巻き戻し（新規イベントのみ・dry-run 専用）
        if: ${{ inputs.rewind_cursor == true }}
        run: |
          # state.json が存在する場合は既存 cursor を保持しつつ対象イベントだけ削除
          if [ -f state.json ]; then
            python3 -c "
import json, sys
s = json.loads(open('state.json').read())
s.pop('peatix_4831575', None)
open('state.json','w').write(json.dumps(s, indent=2))
print('peatix_4831575 の cursor をリセット')
"
          fi

      - name: .env を構築
        run: |
          cp config.env .env
          echo "PEATIX_EMAIL=${{ secrets.PEATIX_EMAIL }}" >> .env
          echo "PEATIX_PASSWORD=${{ secrets.PEATIX_PASSWORD }}" >> .env
          echo "SLACK_TOKEN=${{ secrets.SLACK_TOKEN }}" >> .env

      - name: Peatix ポーリング実行
        run: python3 poll_peatix.py

      - name: state.json を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: peatix-state-${{ github.run_id }}
